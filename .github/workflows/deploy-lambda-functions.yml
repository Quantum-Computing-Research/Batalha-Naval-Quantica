name: Deploy Lambda Functions

on:
  push:
    branches: [ "backend_serverless" ]
    paths:
      - "infra/lambda/**"
      - ".github/workflows/deploy-lambda-functions.yml"

concurrency:
  group: lambda-deploy-${{ github.ref }}
  cancel-in-progress: true
  
env:
  AWS_REGION: us-east-2
  LAMBDA_JOGO_NAME: quantum-battleship-prod-handler
  LAMBDA_JOGADAS_NAME: quantum-battleship-jogadas
  PYTHON_VERSION: "3.12"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      handler: ${{ steps.filter.outputs.handler }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            handler:
              - 'infra/lambda/jogo/**'
            jogadas:
              - 'infra/lambda/jogadas/**'

  deploy-handler:
    needs: changes
    if: needs.changes.outputs.handler == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_LAMBDA_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-lambda-deploy

      - name: Package handler (code + deps)
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist build
          mkdir -p dist build/package

          # deps
          if [ -f "infra/lambda/jogo/requirements.txt" ]; then
            python -m pip install --upgrade pip
            python -m pip install -r infra/lambda/jogo/requirements.txt -t build/package
          fi

          # código do jogo -> RAIZ do zip
          rsync -av \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            infra/lambda/jogo/ build/package/

          # sanity checks: handler.py precisa estar no root do zip
          test -f build/package/handler.py || (echo "[ERROR] handler.py não está no root do pacote" && ls -la build/package && exit 1)

          # mostra o que vai pro zip (ajuda muito a debugar)
          echo "=== package root ==="
          ls -la build/package | sed -n '1,200p'

          (cd build/package && zip -r ../../dist/handler.zip .)
          ls -lh dist/handler.zip

      - name: Deploy handler
        run: |
          aws lambda update-function-code \
            --function-name "${{ env.LAMBDA_JOGO_NAME }}" \
            --zip-file fileb://dist/handler.zip

